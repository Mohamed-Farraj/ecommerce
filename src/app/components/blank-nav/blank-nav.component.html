<!-- ============================================================
     LUXE — Modern Navigation Bar
     ============================================================ -->
<nav class="luxury-nav">
  <div class="luxury-nav__container">
    <!-- Brand Logo -->
    <a routerLink="home" class="luxury-nav__brand">
      <div class="luxury-nav__logo-icon">
        <!-- Replaced image with a generic luxury icon or stylized text to fit the brand -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 text-[var(--color-accent)]">
          <path d="M12 2.25L4.5 5v14l7.5 2.75L19.5 19V5L12 2.25zM12 4.6l6 2.2v11.4l-6 2.2-6-2.2V6.8l6-2.2z"/>
          <path d="M12 9.5L8.5 11l3.5 1.5 3.5-1.5z"/>
        </svg>
      </div>
      <span class="luxury-nav__logo-text">LUXE</span>
    </a>

    <!-- Mobile Menu Toggle -->
    <button (click)="toggleMenu()" class="luxury-nav__toggle" aria-label="Toggle Navigation">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <!-- Nav Links & Actions -->
    <div *ngIf="isMenuOpen" class="luxury-nav__menu" [class.is-open]="isMenuOpen">
      
      <!-- Main Navigation Links -->
      <ul class="luxury-nav__links">
        <li><a class="nav-link" routerLink="home" routerLinkActive="active-nav-link">Home</a></li>
        <li><a class="nav-link" routerLink="products" routerLinkActive="active-nav-link">Collections</a></li>
        <li><a class="nav-link" routerLink="wishlist" routerLinkActive="active-nav-link">Wishlist</a></li>
        <li><a class="nav-link" routerLink="categories" routerLinkActive="active-nav-link">Categories</a></li>
        <li><a class="nav-link" routerLink="brands" routerLinkActive="active-nav-link">Brands</a></li>
        <li><a class="nav-link" routerLink="allorders" routerLinkActive="active-nav-link">Orders</a></li>
      </ul>

      <!-- User Actions & Socials -->
      <div class="luxury-nav__actions">
        <!-- Social Icons -->
        <div class="luxury-nav__socials hidden md:flex items-center gap-3">
            <a href="#" class="luxury-nav__social-link"><i class="fa-brands fa-facebook"></i></a>
            <a href="#" class="luxury-nav__social-link"><i class="fa-brands fa-twitter"></i></a>
            <a href="#" class="luxury-nav__social-link"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="luxury-nav__social-link"><i class="fa-brands fa-tiktok"></i></a>
        </div>

        <div class="luxury-nav__divider hidden md:block"></div>

        <!-- Cart Button -->
        <button routerLink="cart" class="luxury-nav__cart">
          <div class="luxury-nav__cart-badge">{{ cartItemscounter }}</div>
          <i class="fa-solid fa-cart-shopping"></i>
        </button>

        <!-- Sign Out Button -->
        <button (click)="logout()" class="btn-main luxury-nav__auth-btn">
          Sign Out
        </button>
      </div>

    </div>
  </div>
</nav>
