<section data-aos="fade-up">
<div class="luxury-card group">
    <div class="luxury-card__body">
        <div [routerLink]="['/details', productId]" class="luxury-card__link">
          <!-- Image -->
          <div class="luxury-card__img-wrap">
            <img [src]="imgSrc" alt="product image" />
          </div>

          <!-- Info -->
          <h4 class="luxury-card__category">{{ category }}</h4>
          <h5 class="luxury-card__title">{{ title }}</h5>

          <div class="luxury-card__meta">
            <span class="luxury-card__price">
              <i class="fa-solid fa-sterling-sign"></i> {{ price }}
            </span>
            <div class="luxury-card__rating-wrap">
              <div [ngStyle]="{'background-image': getGradient(rating)}" class="luxury-card__stars">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
              </div>
              <span class="luxury-card__rating-badge">{{ rating }}</span>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="luxury-card__actions">
          <button (click)="addToCart(productId)" class="luxury-card__add-btn">
            @if (!isLoading) {
              <span>Add to Cart</span>
            }
            @if (isLoading) {
              <i class="fa fa-spinner fa-spin" aria-hidden="true"></i>
            }
          </button>
          <button (click)="addToWishlist(productId)" class="luxury-card__wish-btn">
            @if (wloading) {
              <i class="fa fa-spinner fa-spin" aria-hidden="true"></i>
            }
            @else {
              <i [ngClass]="{'fa-regular': !wish, 'fa-solid': wish}" class="fa-heart"></i>
            }
          </button>
        </div>
    </div>
</div>
</section>
